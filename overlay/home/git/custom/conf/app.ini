; This is gitea conf file - originally provided by TurnKey and updated on
; firstboot.
;
; For further/full options, please see app.example.ini in this directory
; (default: custom/conf/app.ini).
;
; See https://docs.gitea.com/administration/config-cheat-sheet for additional
; documentation.

APP_NAME = TurnKey Gitea
RUN_USER = git
WORK_PATH = /home/git/
RUN_MODE = prod

[database]
NAME = gitea
USER = gitea
PASSWD = turnkey1
LOG_SQL = false
DB_TYPE = mysql
HOST = 127.0.0.1:3306
SCHEMA =
SSL_MODE = disable
PATH = /home/git/data/gitea.db

[server]
DOMAIN = www.example.com
PROTOCOL = http+unix
HTTP_ADDR = /home/git/run/gitea.sock
UNIX_SOCKET_PERMISSION = 666
SSH_DOMAIN = www.example.com
HTTP_PORT = 3000
ROOT_URL = http+unix://www.example.com:3000/
APP_DATA_PATH = /home/git/data
DISABLE_SSH = false
SSH_PORT = 22
LFS_START_SERVER = true
LFS_JWT_SECRET = fuYkOT7Fu8rtLAmcIFXnm5nyF3hEXVWhS1ZSTa56Lic
OFFLINE_MODE = false

[markup.restructuredtext]
ENABLED = true
FILE_EXTENSIONS = .rst
RENDER_COMMAND = rst2html
IS_INPUT_FILE = false

[mailer]
ENABLED = enabled
FROM = admin@example.com
PROTOCOL = sendmail
SENDMAIL_PATH = /usr/sbin/sendmail
SENDMAIL_TIMEOUT = 5m

[repository]
ROOT = /home/git/data/gitea-repositories

[lfs]
PATH = /home/git/data/lfs

[service]
REGISTER_EMAIL_CONFIRM = true
ENABLE_NOTIFY_MAIL = true
DISABLE_REGISTRATION = false
ALLOW_ONLY_EXTERNAL_REGISTRATION = false
ENABLE_CAPTCHA = false
REQUIRE_SIGNIN_VIEW = false
DEFAULT_KEEP_EMAIL_PRIVATE = false
DEFAULT_ALLOW_CREATE_ORGANIZATION = true
DEFAULT_ENABLE_TIMETRACKING = true
NO_REPLY_ADDRESS = noreply@www.example.org

[openid]
ENABLE_OPENID_SIGNUP = true

[cron.update_checker]
ENABLED = false

[session]
PROVIDER = file

[log]
MODE = console
LEVEL = info
ROOT_PATH = /home/git/log

[repository.pull-request]
DEFAULT_MERGE_STYLE = merge

[repository.signing]
DEFAULT_TRUST_MODEL = committer

[security]
INSTALL_LOCK = true
INTERNAL_TOKEN = eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJuYmYiOjE3MTI3MzMwODF9.bT_-YVP7m9aIy62wuaLOsnMQFuDf6xpWwXdHrCGUbw4
PASSWORD_HASH_ALGO = pbkdf2

